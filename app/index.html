<title>Garment Motion Pack</title>
<style>
html{color-scheme:dark;background:#000}
:root{
  --ink:#ececec;--mute:#7c7c7c;--hair:rgba(255,255,255,.12);
  --chrome:linear-gradient(180deg,#fff 0%,#d6d6d6 28%,#6a6a6a 50%,#ececec 63%,#9a9a9a 84%,#f6f6f6 100%);
  --chrome-x:linear-gradient(100deg,#8c8c8c 0%,#f7f7f7 28%,#7b7b7b 52%,#e4e4e4 78%,#9e9e9e 100%);
  --glass:rgba(10,10,10,.64);--ease:cubic-bezier(.16,.84,.24,1);
  --f:"Helvetica Neue",Helvetica,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:var(--ink);font-family:var(--f);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.chrome{background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent;caret-color:#fff}

/* feed */
#feed{position:fixed;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
#feed::-webkit-scrollbar{display:none}
#feed.locked{overflow:hidden}
.slide{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.stage{position:absolute;inset:0;touch-action:pan-y;transform-origin:50% 50%}
#feed.locked .stage{touch-action:none}
.slide.zoomed .stage{cursor:grab}
body.adding .stage{cursor:crosshair}
.canvas{position:absolute;inset:0;transform-origin:0 0;--s:1}
.frame{position:absolute;inset:0;margin:auto;width:fit-content;height:fit-content}
#feed.intro .frame{animation:rise 1.4s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(4%) scale(.94);filter:blur(14px)}}
.g{display:block;width:min(96vw,calc(88vh * var(--ar)));width:min(96vw,calc(88dvh * var(--ar)));height:auto;max-width:96vw;max-height:88vh;max-height:88dvh;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;pointer-events:none}
.g{filter:brightness(var(--ge,1))}
#feed.moving .g{filter:brightness(var(--ge,1)) blur(calc(var(--mb,0) * 1px));transform:scaleY(calc(1 + var(--mb,0) * .007))}

/* points + inserts */
.links{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.links line{stroke:rgba(236,236,236,.7);stroke-width:1;vector-effect:non-scaling-stroke;transition:opacity .45s var(--ease)}
.pt{position:absolute;width:32px;height:32px;display:grid;place-items:center;transform:translate(-50%,-50%) scale(calc(1 / var(--s)));z-index:2}

(()=>{'use strict';

  $('#nmCount').textContent=NQ.length>1?`Piece ${NI+1} of ${NQ.length}`:'Name this piece';
  nmIn.value=(it.fields&&it.fields.name)||'';$('#nmNext').textContent=NI<NQ.length-1?'Next':'Done';namer.hidden=false;
  try{nmIn.focus({preventScroll:true})}catch(e){}}
nmIn.addEventListener('input',()=>{const it=NQ[NI];if(!it)return;const v=nmIn.value;(it.fields||(it.fields={})).name=v;const sec=secOf(it);
  if(sec){sec.querySelector('.nm').textContent=v||'Tap to name';const dd=sec.querySelector('dd[data-f=name]');if(dd)dd.textContent=v;const g=sec.querySelector('img.g');if(g)g.alt=v||'Garment'}changed()});
nmIn.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();NI++;showNamer();if(namer.hidden)nmIn.blur()}});
async function exportFile(){
  if(!S.items.length)return toast('Add a garment first');
  toast('Packing your lookbook…',8000);
  const items=[];for(const it of S.items){const pts=[];for(const p of it.points)pts.push(Object.assign({},p,{ia:null,img:p.img?await toData(p.img):null}));
    items.push(Object.assign({},it,{a:null,src:await toData(it.src),points:pts}))}
  const m0=S.mode;S.mode='view';const pre=items.map((it,i)=>slideHTML(Object.assign({},it,{open:it.open||Object.values(it.fields||{}).some(Boolean)}),i)).join('').replace(/<section class="slide" data-id="([^"]+)">/g,(m,id)=>m+`<input type="checkbox" class="zt" id="zt-${id}" aria-label="Zoom"><label class="zl" for="zt-${id}"></label>`);S.mode=m0;
  const lean=items.map(it=>Object.assign({},it,{src:'',points:it.points.map(p=>Object.assign({},p,{img:null,pimg:!!p.img}))}));
  const json=JSON.stringify({brand:S.brand,mode:'view',lid:S.lid||uid(),savedAt:Date.now(),items:lean}).replace(/</g,'\\u003c');
  const doc=new DOMParser().parseFromString(SRC,'text/html');
  doc.querySelectorAll('script').forEach(n=>{if(n.id!=='app'&&n.id!=='state')n.remove()});
  doc.body.className='view';doc.documentElement.classList.add('nojs');doc.getElementById('feed').innerHTML=pre;doc.getElementById('brand').textContent=S.brand||'';
  const html=('<!doctype html>\n'+doc.documentElement.outerHTML).replace(/(<script id="state" type="application\/json">)[\s\S]*?(<\/script>)/,(m,x,y)=>x+json+y);
  const name=((S.brand||'lookbook').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'lookbook')+'-lookbook.html';
  let dl=null;try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename:name,data:new Blob([html],{type:'text/html'})});toast('Saved to your device')}catch(e){toast(e&&e.code==='declined'?'Save cancelled':'Could not save the file here')}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);toast('Saved — opens with full motion');
}
/* ---------- fullscreen ---------- */
const fsEl=document.documentElement,fsOK=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
$('#fsBtn').hidden=!fsOK;
function toggleFs(){const on=document.fullscreenElement||document.webkitFullscreenElement;
  try{const r=on?(document.exitFullscreen||document.webkitExitFullscreen).call(document):(fsEl.requestFullscreen||fsEl.webkitRequestFullscreen).call(fsEl);if(r&&r.catch)r.catch(()=>toast('Full screen is not available here'))}catch(e){toast('Full screen is not available here')}}
/* ---------- cloud save (hosted page) ---------- */
let P=null,RO=false,saveT=0,saving=false,again=false;
const LOCAL=!(window.claude&&window.claude.use),KEY='lb:'+(S.lid||'default');
const IDB={db:null,open(){return new Promise(res=>{try{const r=indexedDB.open('motionpack',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(this.db=r.result);r.onerror=()=>res(null)}catch(e){res(null)}})},
  async get(k){const d=this.db||await this.open();if(!d)return null;return new Promise(res=>{try{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})},
  async set(k,v){const d=this.db||await this.open();if(!d)return false;return new Promise(res=>{try{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}};
async function saveLocal(){if(await IDB.set(KEY,{savedAt:Date.now(),brand:S.brand,items:S.items}))dirty=false}
function changed(){dirty=true;clearTimeout(saveT);if(P&&!RO)saveT=setTimeout(save,900);else if(LOCAL)saveT=setTimeout(saveLocal,700)}
function drop(id){if(id&&P&&P.assets)P.assets.delete(id).catch(()=>{})}
function toBlob(d){const i=d.indexOf(','),mime=d.slice(5,d.indexOf(';')),bin=atob(d.slice(i+1)),u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return new Blob([u],{type:mime})}
const isData=s=>typeof s==='string'&&s.indexOf('data:')===0;
async function save(){
  if(!P||RO)return;if(saving){again=true;return}saving=true;
  try{
    for(const it of S.items){if(!it.a&&isData(it.src)){const r=await P.assets.upload(toBlob(it.src));it.a=r.id}
      for(const p of it.points){if(p.img&&!p.ia&&isData(p.img)){const r=await P.assets.upload(toBlob(p.img));p.ia=r.id}}}
    await P.ref.set({brand:S.brand||'',items:S.items.map(it=>({id:it.id,a:it.a||null,ar:it.ar||1,open:!!it.open,fields:it.fields||{},
      points:it.points.map(p=>({id:p.id,x:p.x,y:p.y,cx:p.cx,cy:p.cy,title:p.title||'',text:p.text||'',ia:p.ia||null}))}))});
    dirty=false;
  }catch(e){toast('Not saved: '+((e&&e.code)||'connection problem')+'. Edit again to retry.',3500)}
  saving=false;if(again){again=false;save()}
}
async function cloud(){
  if(!window.claude||!claude.use)return;
  let db=null,assets=null;try{[db,assets]=await Promise.all([claude.use('db'),claude.use('assets')])}catch(e){}
  if(!db)return;
  const ref=db.doc('lookbook/main');let d=null;
  try{const snap=await ref.get();d=snap.exists?snap.data():null}catch(e){}
  P={db,assets,ref};RO=!assets;document.documentElement.classList.toggle('ro',RO);
  if(d&&Array.isArray(d.items)&&!S.items.length){
    S.brand=d.brand||S.brand;
    S.items=d.items.filter(it=>it.a).map(it=>Object.assign({},it,{src:'/_blob/'+it.a,fields:it.fields||{},points:(it.points||[]).map(p=>Object.assign({},p,{img:p.ia?'/_blob/'+p.ia:null}))}));
    S.mode=S.items.length?'view':'edit';
  }else if(S.items.length&&!RO)changed();
  if(RO)S.mode='view';
  render(true);if(!ed())hint();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-cmd]');if(!b)return;const c=b.dataset.cmd;
  if(c==='add'){ctx={kind:'add'};fileIn.multiple=true;fileIn.value=''}
  else if(c==='fs')toggleFs();
  else if(c==='prev')go(-1);
  else if(c==='next')go(1);
  else if(c==='nnext'){NI++;showNamer();if(namer.hidden)nmIn.blur()}
  else if(c==='nskip'){NQ=[];namer.hidden=true;nmIn.blur()}
  else if(c==='point'){if(!S.items.length)return toast('Add a garment first');setAdding(!adding)}
  else if(c==='save')exportFile();
  else if(c==='mode')setMode(ed()?'view':'edit');
  else if(c==='zin'||c==='zout'){const sec=cur();if(!sec)return;const z=getZ(sec),r=sec.getBoundingClientRect();zoomAt(sec,c==='zin'?z.ts*1.7:z.ts/1.7,r.width/2,r.height/2,.14)}
});
addEventListener('beforeunload',e=>{if(dirty&&ed()&&!P){e.preventDefault();e.returnValue=''}});
let rz;addEventListener('resize',()=>{clearTimeout(rz);const i=idx();rz=setTimeout(()=>{for(const s of feed.children){const z=Z.get(s);if(z){Object.assign(z,{s:1,x:0,y:0,ts:1,tx:0,ty:0});apply(s,z,0,false)}}zooms.clear();lock(false);feed.scrollTop=i*feed.clientHeight;parallax()},150)});

try{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),d=x.createImageData(160,160);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);document.getElementById('grain').style.backgroundImage=`url(${c.toDataURL()})`}catch(e){}
function intro(){
  const el=document.getElementById('intro');if(!el)return Promise.resolve();
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,b=(S.brand||'').trim(),name=(!b||/^your label$/i.test(b))?'Motion Pack':b;
  const nm=$('#inName');nm.insertAdjacentHTML('afterbegin',[...name.toUpperCase()].map((c,i)=>c===' '?'<span class="sp"> </span>':`<span style="--d:${(200+i*90+Math.random()*140)|0}ms">${esc(c)}</span>`).join(''));
  $('#inSub').textContent=name==='Motion Pack'?'Garment Lookbook':'Motion Pack';
  requestAnimationFrame(()=>el.classList.add('go'));
  return new Promise(res=>{let done=false;const end=()=>{if(done)return;done=true;el.classList.add('out');res();setTimeout(()=>el.remove(),1800)};
    setTimeout(end,reduce?400:Math.min(4200,Math.max(3000,name.length*90+2500)));
    setTimeout(()=>['pointerdown','keydown','wheel','touchstart'].forEach(t=>addEventListener(t,end,{once:true,passive:true})),500)});
}
render(false);
const loaded=LOCAL?IDB.get(KEY).then(d=>{if(d&&Array.isArray(d.items)&&d.items.length&&(!S.items.length||(d.savedAt||0)>(S.savedAt||0))){const m=S.mode;S.brand=d.brand;S.items=d.items;S.mode=S.items.length?m:'edit';render(false)}}):Promise.resolve();
Promise.race([loaded,new Promise(r=>setTimeout(r,400))]).then(intro).then(()=>{L.tp=1;kick();render(true);if(!ed())setTimeout(hint,900)});
cloud();
})();
</script>
